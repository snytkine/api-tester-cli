name: Release — GraalVM Native Binaries

on:
  push:
    tags:
      - 'v*.*.*'

# Needs write access to attach assets to the GitHub Release created by release-please.
permissions:
  contents: write

jobs:
  build-native:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset-name: cmd-rest-linux-amd64
            march-flag: "-march=x86-64-v3"
          - os: macos-latest
            asset-name: cmd-rest-macos-aarch64
            march-flag: "" # march flags are not used on ARM/Apple Silicon architecture
          - os: windows-latest
            asset-name: cmd-rest-windows-amd64.exe
            march-flag: "-march=x86-64-v3"
          - name: MacOS-Intel-i3 # Mac Intel i3 Target (Your specific machine)
            os: macos-13 # macos-13 is the standard Intel x86 runner
            march-flag: "-march=x86-64-v2" # Lower tier safety for your i3
            asset-name: cmd-rest-macos-intelx86

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Must go through the full lifecycle, never `native:compile` directly: the native
      # profile binds spring-boot:process-aot to prepare-package and compile-no-fork to
      # package. Invoking the plugin goal on its own skips process-aot, so the generated
      # ApplicationContextInitializer that reflect-config.json registers by name — along
      # with native-image.properties, which supplies -H:Class — is never produced. See
      # native-build-support.md section 4. Tests are covered by the maven.yml workflow.
      - name: Build native image
        shell: bash
        run: ./mvnw -Pnative clean package -DskipTests -B

      - name: Rename binary
        shell: bash
        run: |
          src=$([ "${{ runner.os }}" = "Windows" ] \
            && echo "target/cmd-rest.exe" \
            || echo "target/cmd-rest")
          mv "$src" "target/${{ matrix.asset-name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.asset-name }}
