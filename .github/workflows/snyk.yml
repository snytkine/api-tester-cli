name: Example workflow using Snyk
on:
  push:
    branches: [ main ] # Triggers the workflow when you push to your main branch

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # Installs the Snyk CLI onto the host machine using a secure version tag
      - name: Install Snyk CLI
        uses: snyk/actions/setup@v2

      # Runs the scan on your codebase using Java 25
      - name: Run Snyk test
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
