name: Example workflow using Snyk
on:
  push:
    branches: [ main ] # Triggers when you push to your main branch

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # Downloads and unpacks the Snyk CLI onto the host machine
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # Natively executes the test under your configured Java 25 path
      - name: Run Snyk test
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
