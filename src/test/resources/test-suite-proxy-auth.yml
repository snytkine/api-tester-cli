---
name: "Proxy – authenticated tunnel"
rest-client:
  base-url: "[[${cli.base_url}]]"
  connect-timeout: 5000
  ssl:
    skip-certificate-validation: true
  proxy:
    url: "[[${cli.proxy_url}]]"
    username: "[[${env.PROXY_USER}]]"
    password: "[[${env.PROXY_PASSWORD}]]"
tests:
- name: "GET through authenticated tunnel"
  request:
    method: "GET"
    url: "/api"
  assertions:
  - type: "status_code"
    expected: 200
